<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Two theme colours, one per scheme, and no single one that has to guess.
     An installed app's status bar is painted from these, so one hardcoded value
     would put a dark bar on a light page (or the reverse) until the user changed
     their phone. The manifest deliberately carries no `theme_color` for the same
     reason: an installed app's chrome cannot express a scheme variant, so it
     would override both of these. -->
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">
<meta name="description" content="A minimal offline-capable counter.">
<title>Simple PWA</title>
<link rel="manifest" href="./manifest.webmanifest">
<!-- The SVG is the icon: it is the committed source of truth, and the browser
     scales it. The PNGs beside it are rasterized from this same file at build
     time, for the manifest and for iOS. -->
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <!-- The only element that changes when the app works. Rust owns its text from
       the first frame, so there is no "loading" state to flash: the number is
       real before the user can see it. `aria-live` makes every change announce
       itself, and the visible text is already the accessible name. -->
  <p id="message" role="status" aria-live="polite">0 — nothing yet</p>
  <!-- The label says what the button does. It used to say "Say hello", left
       over from a template whose app only printed a greeting. -->
  <button id="hello-button" type="button">Add one</button>

  <!-- Nothing here says the app is ready for offline use: a line that only ever
       reports good news the reader did not ask about is noise, and it was the
       only thing standing between the button and the bottom of the panel. The
       worker still registers; the failure box below is the one worth the
       reader's attention. -->
  <p id="error" role="alert" hidden></p>
</main>
<noscript>This counter needs JavaScript enabled. Turn it on and reload to use it.</noscript>
<!-- The one script in the document: it hands over to the generated bindings and
     does nothing else. No state, no rendering, no event handling — everything
     below the import is the failure message for the case where the app never
     loads, which is a real case worth saying something about. -->
<script type="module">
import('./app.js').then(m => m.default()).catch(error => {
  const box = document.getElementById('error');
  box.hidden = false;
  box.textContent = 'Simple PWA could not start. Reload the page, or check your connection. ' + error;
});
</script>
</body>
</html>
